<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="../favicon.png" type="image/png">
<title>AI Kamai — Agency Launch Kit</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root{--bg:#04060b;--surface:#0a0d16;--surface2:#10141f;--text:#e8edf5;--muted:#8b94a8;
    --grad:linear-gradient(93deg,#22d3ee 0%,#3b82f6 100%);
    --green:#21c45d;--border:rgba(148,163,184,.13);--border-hi:rgba(148,163,184,.32)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;line-height:1.65;overflow-x:clip;-webkit-text-size-adjust:100%}
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 80px}
  .grad-text{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .muted{color:var(--muted)}
  .btn{display:inline-block;padding:14px 22px;border-radius:13px;font-weight:800;font-size:.98rem;text-decoration:none;color:#03121a;background:var(--grad)}
  .lock{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
  .lock h1{font-size:1.6rem;margin:12px 0}
  .lock p{max-width:420px;font-size:.95rem;margin-bottom:22px}
  header{padding:22px 0 10px}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .logo{font-weight:900;font-size:1.05rem;letter-spacing:-.01em}
  .iconbtn{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:8px 12px;color:var(--text);font-size:.8rem;font-weight:700;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
  .iconbtn svg,.act svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .lead{font-size:.9rem;margin-bottom:16px}
  .tabs{display:flex;gap:8px;overflow-x:auto;padding:10px 0;-webkit-overflow-scrolling:touch;position:sticky;top:0;background:var(--bg);z-index:10}
  .tab{flex:0 0 auto;padding:9px 13px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:.8rem;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
  .tab svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{background:var(--grad);color:#03121a;border-color:transparent}
  h2{font-size:1.25rem;margin:22px 0 8px}
  h3{font-size:1rem;margin:16px 0 6px;color:#fff}
  section p, section li{font-size:.92rem;color:var(--muted)}
  ul,ol{padding-left:20px}
  li{margin-bottom:6px}
  b{color:var(--text)}
  .step{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;margin:14px 0}
  .step .n{display:inline-block;width:26px;height:26px;border-radius:8px;background:var(--grad);color:#03121a;font-weight:900;font-size:.85rem;text-align:center;line-height:26px;margin-bottom:8px}
  .step h3{margin-top:0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:16px;margin:14px 0}
  .card .cat{font-size:.7rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#22d3ee}
  .card h3{margin:4px 0 8px}
  .card p.pt{font-size:.88rem;color:var(--muted);white-space:pre-wrap}
  .row{display:flex;gap:8px;margin-top:12px}
  .act{flex:1;text-align:center;padding:10px;border-radius:10px;border:none;font-weight:800;font-size:.82rem;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .copy{background:var(--grad);color:#03121a}
  .ghostb{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:#1e1e2a;border:1px solid var(--green);color:#fff;padding:10px 18px;border-radius:10px;font-size:.85rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:99}
  .toast.show{opacity:1}
  input[type=number],select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1rem;margin:6px 0 14px}
  .result{background:var(--surface2);border:1px solid var(--green);border-radius:12px;padding:14px;margin:10px 0;font-size:.95rem}
  table{width:100%;border-collapse:collapse;margin:12px 0;font-size:.85rem}
  th,td{border:1px solid var(--border);padding:9px 10px;text-align:left;vertical-align:top}
  th{background:var(--surface2);color:var(--text);font-size:.78rem;text-transform:uppercase;letter-spacing:.04em}
  td{color:var(--muted)}
  td b{color:var(--text)}
  .cal .day{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
  .cal .d{flex:0 0 42px;color:#22d3ee;font-weight:900;font-size:.85rem}
  .cal .t{font-size:.88rem;color:var(--muted)}
  .foot{margin-top:24px;text-align:center;font-size:.75rem;color:var(--muted)}
  .note{background:linear-gradient(93deg,rgba(34,211,238,.08),rgba(59,130,246,.08));border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.82rem;margin:12px 0}

  
  /* ===== premium pass ===== */
  :focus-visible{outline:2px solid #a78bfa;outline-offset:3px;border-radius:6px}
  .mark{width:64px;height:64px;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.6rem;color:#03121a;margin:0 auto 16px;box-shadow:0 10px 40px rgba(34,211,238,.25)}
  .lock h1{font-size:1.7rem;line-height:1.25;margin:8px 0}
  .lock h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
  .keybox{display:flex;gap:10px;max-width:380px;margin:20px auto 10px;width:100%}
  .keybox input{flex:1;background:var(--surface);border:1px solid rgba(255,255,255,.22);border-radius:14px;color:var(--text);padding:14px 16px;font-size:1rem;font-family:inherit}
  .keybox input::placeholder{color:var(--muted)}
  .keybox .btn{padding:14px 22px;font-size:.95rem;white-space:nowrap}
  .keybox .btn:active{transform:scale(.97)}
  .lockerr{color:#ff7a7a;font-size:.85rem;min-height:1.2em;margin:6px 0}
  .lockalt{display:inline-block;margin-top:12px;color:var(--muted);font-size:.9rem;text-decoration:none;border-bottom:1px dashed rgba(255,255,255,.22)}
  .lockalt:hover{color:var(--text)}
  .trust{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:26px}
  .trust span{font-size:.75rem;color:var(--muted);background:linear-gradient(93deg,rgba(34,211,238,.12),rgba(59,130,246,.12));border:1px solid var(--border);border-radius:999px;padding:5px 12px}
  .tabs{background:rgba(4,6,11,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);top:0;padding:12px 0;transition:border-color .2s}
  .tab:hover{color:var(--text);border-color:rgba(255,255,255,.22)}
  .tab:active{transform:scale(.96)}
  .step,.card{transition:border-color .25s,transform .25s}
  .step:hover,.card:hover{border-color:rgba(255,255,255,.22);transform:translateY(-2px)}
  .act:active{transform:scale(.96)}
  .iconbtn:hover{border-color:rgba(255,255,255,.22)}
  section[data-s]{animation:akfade .45s ease}
  @keyframes akfade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){section[data-s]{animation:none}.step:hover,.card:hover{transform:none}.keybox .btn:active,.act:active,.tab:active{transform:none}}

  @media (min-width:900px){
    .wrap{max-width:880px;padding:0 24px 100px}
  }
</style>
</head>
<body>
<div class="lock" id="lock" style="display:none">
  <div class="mark">AK</div>
  <div class="logo">AI <span class="grad-text">Kamai</span></div>
  <h1><span class="grad-text">Agency Launch Kit</span></h1>
  <p>This is a paid product (₹999, one-time). Your access link arrives on WhatsApp — or paste your key here to unlock directly.</p>
  <div class="keybox">
    <input id="keyIn" placeholder="Enter your access key" autocomplete="off">
    <button id="goBtn" class="btn">Unlock</button>
  </div>
  <div class="lockerr" id="lockErr"></div>
  <a class="lockalt" href="https://wa.me/917737077479?text=KIT%20-%20mujhe%20Agency%20Launch%20Kit%20kharidna%20hai%20(%E2%82%B9999)">No key yet? Message "KIT" on WhatsApp — ₹999, UPI →</a>
  <div class="trust"><span>10 sections</span><span>25 scripts</span><span>Lifetime updates</span><span>7-day refund</span></div>
</div>

<div class="wrap" id="app" style="display:none"><div class="toast" id="toast">Copied</div>

<script src="kit-data.js"></script>
<script>
(function(){
  var given = new URLSearchParams(location.search).get("key");
  var saved = localStorage.getItem("ak_kit_key");
  var candidates = [];
  if (given) candidates.push(given.trim());
  if (saved) candidates.push(saved);
  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length); for (var i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  function text(buf){ return new TextDecoder().decode(buf); }
  function tryUnlock(cand){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(cand)).then(function(h){
      return crypto.subtle.importKey("raw", h, {name:"AES-GCM"}, false, ["decrypt"]);
    }).then(function(k){
      var found = Promise.resolve(false);
      KENC.wraps.forEach(function(w){
        found = found.then(function(got){
          if (got) return got;
          return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(w.iv)}, k, b64(w.ct))
            .then(function(cek){ return crypto.subtle.importKey("raw", cek, {name:"AES-GCM"}, false, ["decrypt"]); })
            .then(function(ck){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(KENC.iv)}, ck, b64(KENC.ct)); })
            .then(function(buf){
              var d = JSON.parse(text(buf));
              document.getElementById("app").innerHTML = d.html;
              var o = (new Function(d.js + ";return {S:(typeof SCRIPTS!=='undefined'?SCRIPTS:[]),O:(typeof OBJS!=='undefined'?OBJS:[]),N:(typeof NICHES!=='undefined'?NICHES:[]),T:(typeof TPLS!=='undefined'?TPLS:[]),C:(typeof CAL!=='undefined'?CAL:[])};"))();
              window.SCRIPTS=o.S; window.OBJS=o.O; window.NICHES=o.N; window.TPLS=o.T; window.CAL=o.C;
              return true;
            }).catch(function(){ return false; });
        });
      });
      return found;
    });
  }
  if (!candidates.length) {
    document.getElementById("lock").style.display = "flex";
  } else {
    candidates.reduce(function(chain, cand){
      return chain.then(function(ok){ return ok ? ok : tryUnlock(cand); });
    }, Promise.resolve(false)).then(function(ok){
      if (ok) {
        if (given) localStorage.setItem("ak_kit_key", given.trim());
        document.getElementById("app").style.display = "block";
        initApp();
      } else {
        document.getElementById("lock").style.display = "flex";
      }
    }).catch(function(){ document.getElementById("lock").style.display = "flex"; });
  }
  
  function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
  function copyText(p){
    return function(){
      (navigator.clipboard?navigator.clipboard.writeText(p):Promise.reject()).then(t).catch(function(){
        var ta=document.createElement("textarea");ta.value=p;document.body.appendChild(ta);ta.select();
        document.execCommand("copy");document.body.removeChild(ta);t();
      });
    };
  }
  function t(){var x=document.getElementById("toast");x.classList.add("show");setTimeout(function(){x.classList.remove("show")},1400);}
  function renderList(el, arr){
    arr.forEach(function(p){
      var d = document.createElement("div");
      d.className = "card";
      d.innerHTML = '<div class="cat">'+esc(p.c)+'</div><h3>'+esc(p.t)+'</h3><p class="pt">'+esc(p.p)+'</p>'
        + '<div class="row"><button class="act copy"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Copy</button></div>';
      d.querySelector(".copy").onclick = copyText(p.p);
      el.appendChild(d);
    });
  }
  function initApp(){
    renderList(document.getElementById("scriptList"), SCRIPTS);
    renderList(document.getElementById("objList"), OBJS);
    renderList(document.getElementById("nicheList"), NICHES);
    renderList(document.getElementById("tplList"), TPLS);
    var calEl = document.getElementById("calList");
    CAL.forEach(function(c){
      var d = document.createElement("div");
      d.className = "day";
      d.innerHTML = '<div class="d">D'+c[0]+'</div><div class="t">'+esc(c[1])+'</div>';
      calEl.appendChild(d);
    });
    function calc(){
      var goal = parseFloat(document.getElementById("goal").value);
      var hours = parseFloat(document.getElementById("hours").value);
      var oh = parseFloat(document.getElementById("overhead").value);
      if (!isFinite(goal) || goal <= 0) {
        document.getElementById("calcOut").innerHTML = "Pehle apna monthly goal daalo (0 se zyada) — phir rate nikalenge.";
        return;
      }
      if (!isFinite(hours) || hours <= 0) {
        document.getElementById("calcOut").innerHTML = "Hafte me kitne ghante kaam karoge, wo daalo (1-100).";
        return;
      }
      hours = Math.min(hours, 100);
      var ov = (isFinite(oh) ? Math.min(Math.max(oh, 0), 90) : 0) / 100;
      var billable = hours * 4 * (1 - ov);
      var rate = Math.ceil(goal / billable / 50) * 50;
      var perClient = Math.max(rate * billable / 4, 1);
      var clients = Math.min(Math.ceil(goal / perClient), 99);
      var goalShow = goal > 999999 ? (goal/100000).toFixed(0) + " lakh" : Math.round(goal).toLocaleString("en-IN");
      document.getElementById("calcOut").innerHTML =
        "Tujhe <b>₹"+rate+"/ghanta</b> charge karna chahiye (billable ~"+billable.toFixed(0)+" ghante/mahina).<br>" +
        "Ek client <b>₹"+Math.round(perClient)+"</b>/mahina ka retainer => <b>"+clients+"</b> client(s) = ₹"+goalShow+" goal.<br>" +
        "Chhota project (8-12 ghante): <b>₹"+rate*8+"</b> se ₹"+rate*12+" range.";
    }
    ["goal","hours","overhead"].forEach(function(id){
      document.getElementById(id).addEventListener("input", calc);
      document.getElementById(id).addEventListener("change", calc);
    });
    calc();
    var sections = [
      ["playbook","Playbook","<path d='M4 19.5A2.5 2.5 0 0 1 6.5 17H20'/><path d='M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z'/>"],
      ["scripts","Scripts","<path d='M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z'/>"],
      ["objections","Objections","<path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/>"],
      ["niches","Niches","<path d='M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z'/><circle cx='12' cy='10' r='3'/>"],
      ["pricing","Pricing","<circle cx='12' cy='12' r='10'/><path d='M12 6v12M9 9h6M9 15h6'/>"],
      ["templates","Templates","<path d='M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z'/><path d='M14 2v6h6'/>"],
      ["calendar","30 Days","<rect x='3' y='4' width='18' height='18' rx='2'/><path d='M16 2v4M8 2v4M3 10h18'/>"],
      ["delivery","Delivery","<path d='M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z'/><path d='M3.27 6.96 12 12.01l8.73-5.05M12 22.08V12'/>"],
      ["legal","Legal","<path d='M12 3v18M5 7l7-4 7 4'/><path d='M3 21h18'/>"],
      ["walk","Case Study","<path d='M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z'/>"]
    ];
    var tabsEl = document.getElementById("tabs");
    sections.forEach(function(s,i){
      var b = document.createElement("button");
      b.className = "tab" + (i===0 ? " on" : "");
      b.innerHTML = '<svg viewBox="0 0 24 24">'+s[2]+'</svg>'+s[1];
      b.onclick = function(){
        document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on")});
        b.classList.add("on");
        document.querySelectorAll("section").forEach(function(sec){sec.style.display = sec.dataset.s === s[0] ? "block" : "none";});
        window.scrollTo(0,0);
      };
      tabsEl.appendChild(b);
    });
  }
window.akKitInit = initApp;
  document.getElementById("goBtn").onclick = function(){
    var v = document.getElementById("keyIn").value.trim();
    if (!v) { document.getElementById("lockErr").textContent = "Enter your access key first."; return; }
    document.getElementById("lockErr").textContent = "";
    tryUnlock(v).then(function(ok){
      if (ok) { localStorage.setItem("ak_kit_key", v); document.getElementById("lock").style.display = "none"; document.getElementById("app").style.display = "block"; initApp(); }
      else { document.getElementById("lockErr").textContent = "That key doesn't match — check it and paste again."; }
    });
  };
  document.getElementById("keyIn").addEventListener("keydown", function(e){ if (e.key === "Enter") document.getElementById("goBtn").click(); });
})();
</script>
<script>
/* AI Kamai analytics — anonymous, coarse, self-disabling when unavailable */
(function(){
  try {
    if (sessionStorage.getItem("ak_analytics_off")) return;
    var page = (location.pathname.indexOf("vault/free") > -1 ? "free" :
                location.pathname.indexOf("vault") > -1 ? "vault" :
                location.pathname.indexOf("kit") > -1 ? "kit" :
                location.pathname.indexOf("starter") > -1 ? "starter" : "store");
    var ref = "direct";
    try { ref = location.hostname === document.referrer.split("/")[2] ? "internal" : (document.referrer ? new URL(document.referrer).hostname : "direct"); } catch(e){}
    function send(ev){
      fetch("https://beyond.base44.app/functions/logEvent", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ page: page, ev: ev, ref: ref })
      }).catch(function(){ sessionStorage.setItem("ak_analytics_off", "1"); });
    }
    send("view");
    document.addEventListener("click", function(e){
      var t = e.target.closest("[data-ev]");
      if (t) send(t.getAttribute("data-ev"));
    }, true);
  } catch(e){}
})();
</script>

</body>
</html>
